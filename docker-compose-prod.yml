services:
  spring-app:
    image: ${IMAGE_FULL}
    container_name: ${CI_PROJECT_NAME}
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "9902:8080"

    environment:
      - SPRING_PROFILES_ACTIVE=prod

      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-cpass}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      - SPRING_DATA_REDIS_HOST=${REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}

      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-guest}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}

      - APP_ADMIN_TOKEN=${ADMIN_TOKEN}
      - APP_SECURITY_MASTER_KEY=${SECURITY_MASTER_KEY}
      - APP_OTP_HASH_PEPPER=${OTP_HASH_PEPPER}

      - APP_KYC_S3_ENDPOINT=${S3_ENDPOINT}
      - APP_KYC_S3_BUCKET=${S3_BUCKET:-cpass-kyc}
      - APP_KYC_S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - APP_KYC_S3_SECRET_KEY=${S3_SECRET_KEY}

      - LOGGING_LEVEL_ROOT=${LOG_LEVEL_ROOT:-INFO}
      - LOGGING_LEVEL_COM_CPASS_PLATFORM=${LOG_LEVEL_CPASS:-INFO}

    networks:
      - cpass_net

networks:
  cpass_net:
    external: true
