version: "3.9"

services:
  app:
    build: .
    container_name: cpass-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cpass
      SPRING_DATASOURCE_USERNAME: cpass
      SPRING_DATASOURCE_PASSWORD: cpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      APP_SECURITY_MASTER_KEY: 0123456789abcdef0123456789abcdef
      APP_ADMIN_TOKEN: change-me-admin-token
      APP_KYC_S3_ENDPOINT: http://minio:9000
      APP_KYC_S3_BUCKET: cpass-kyc
      APP_KYC_S3_ACCESS_KEY: minioadmin
      APP_KYC_S3_SECRET_KEY: minioadmin
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16
    container_name: cpass-postgres
    environment:
      POSTGRES_DB: cpass
      POSTGRES_USER: cpass
      POSTGRES_PASSWORD: cpass
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cpass -d cpass" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: cpass-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cpass-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    container_name: cpass-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/cpass-kyc
      "

networks:
  default:
    name: cpass-network
