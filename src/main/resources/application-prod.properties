# ----------------------------------------
# SERVER
# ----------------------------------------
server.port=8080
server.servlet.context-path=/internal-cpaas

# ----------------------------------------
# DATABASE
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:cpass}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ----------------------------------------
# HIKARI
# ----------------------------------------
spring.datasource.hikari.pool-name=HikariCpassProdPool
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true

# ----------------------------------------
# REDIS
# ----------------------------------------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=3s
spring.data.redis.repositories.enabled=false

# ----------------------------------------
# RABBITMQ
# ----------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# ----------------------------------------
# APP SECURITY
# ----------------------------------------
app.admin-token=${ADMIN_TOKEN}
app.security.master-key=${SECURITY_MASTER_KEY}

# ----------------------------------------
# OTP
# ----------------------------------------
app.otp.hash-pepper=${OTP_HASH_PEPPER}

# ----------------------------------------
# KYC / S3 (MinIO)
# ----------------------------------------
app.kyc.s3.endpoint=${S3_ENDPOINT}
app.kyc.s3.access-key=${S3_ACCESS_KEY}
app.kyc.s3.secret-key=${S3_SECRET_KEY}

# ----------------------------------------
# ACTUATOR
# ----------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized

# ----------------------------------------
# SWAGGER / OPENAPI
# ----------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ----------------------------------------
# LOGGING
# ----------------------------------------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.cpass.platform=${LOG_LEVEL_CPASS:INFO}
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
