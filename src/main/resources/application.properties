# ----------------------------------------
# APPLICATION (BASE - commun dev & prod)
# ----------------------------------------
spring.application.name=internal-cpaas

# ----------------------------------------
# JPA / FLYWAY (partagé)
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ----------------------------------------
# MESSAGING (RabbitMQ exchange/queue fixes)
# ----------------------------------------
app.messaging.exchange=cpass.message.exchange
app.messaging.queue=cpass.message.dispatch.queue
app.messaging.routing-key=cpass.message.dispatch

# ----------------------------------------
# HMAC (valeurs fixes)
# ----------------------------------------
app.security.hmac.allowed-skew-seconds=300
app.security.hmac.nonce-ttl-seconds=300
app.security.hmac.signing-version=v1
app.security.jwt.secret=${JWT_SECRET:change-this-jwt-secret-with-a-long-random-value}
app.security.jwt.issuer=${JWT_ISSUER:cpass-platform}
app.security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}

# ----------------------------------------
# OTP (valeurs fixes)
# ----------------------------------------
app.otp.length=6
app.otp.ttl-seconds=300
app.otp.max-send-retries=3
app.otp.max-verify-attempts=5
app.otp.cooldown-seconds=60
app.otp.message-template=Your verification code is {otp}

# ----------------------------------------
# S3 / KYC (valeurs fixes)
# ----------------------------------------
app.kyc.s3.region=us-east-1
app.kyc.s3.bucket=${MINIO_BUCKET_NAME:cpass-kyc}
app.kyc.validity-days=${KYC_VALIDITY_DAYS:365}
app.kyc.auto-approve-score-threshold=${KYC_AUTO_APPROVE_SCORE:75}
app.kyc.external-fallback-score-threshold=${KYC_FALLBACK_SCORE:70}
app.kyc.async-enabled=${KYC_ASYNC_ENABLED:true}
app.kyc.messaging.exchange=${KYC_QUEUE_EXCHANGE:cpass.kyc.exchange}
app.kyc.messaging.queue=${KYC_QUEUE_NAME:cpass.kyc.queue}
app.kyc.messaging.routing-key=${KYC_QUEUE_ROUTING_KEY:cpass.kyc.process}
app.kyc.ocr.engine=${KYC_OCR_ENGINE:auto}
app.kyc.flow.level-0=${KYC_FLOW_LEVEL_0:OTP}
app.kyc.flow.level-1=${KYC_FLOW_LEVEL_1:ID_UPLOAD,OCR_EXTRACTION,DOCUMENT_EXPIRY_CHECK,FACE_MATCH}
app.kyc.flow.level-2=${KYC_FLOW_LEVEL_2:ID_UPLOAD,OCR_EXTRACTION,DOCUMENT_EXPIRY_CHECK,FACE_MATCH,FIELD_VERIFICATION}
app.kyc.flow.level-3=${KYC_FLOW_LEVEL_3:ID_UPLOAD,OCR_EXTRACTION,DOCUMENT_EXPIRY_CHECK,FACE_MATCH,FIELD_VERIFICATION,SOCIAL_GUARANTEE,EXTERNAL_PROVIDER_FALLBACK}

# ----------------------------------------
# IDENTITY VERIFICATION (MVP server-side KYC)
# ----------------------------------------
app.kyc.verification.face-match-threshold=${KYC_VERIF_FACE_MATCH_THRESHOLD:75}
app.kyc.verification.auto-approve-score-threshold=${KYC_VERIF_AUTO_APPROVE_SCORE:75}
app.kyc.verification.review-score-threshold=${KYC_VERIF_REVIEW_SCORE:50}
app.kyc.verification.validity-days=${KYC_VERIF_VALIDITY_DAYS:365}
app.kyc.verification.async-enabled=${KYC_VERIF_ASYNC_ENABLED:true}
# Score weights (must sum to 100)
app.kyc.verification.score-weight.document-readability=${KYC_VERIF_WEIGHT_READABILITY:25}
app.kyc.verification.score-weight.ocr-confidence=${KYC_VERIF_WEIGHT_OCR:20}
app.kyc.verification.score-weight.document-validity=${KYC_VERIF_WEIGHT_VALIDITY:20}
app.kyc.verification.score-weight.face-match=${KYC_VERIF_WEIGHT_FACE:35}
# Stub settings (replace with real OCR/face match provider in production)
app.kyc.verification.stub.face-match-score=${KYC_VERIF_STUB_FACE_SCORE:80}
# RabbitMQ
app.kyc.verification.messaging.exchange=${KYC_VERIF_QUEUE_EXCHANGE:cpass.identity.verification.exchange}
app.kyc.verification.messaging.queue=${KYC_VERIF_QUEUE_NAME:cpass.identity.verification.queue}
app.kyc.verification.messaging.routing-key=${KYC_VERIF_QUEUE_ROUTING_KEY:cpass.identity.verification.process}

# ----------------------------------------
# CORS (comma-separated list, override via env var in prod)
# ----------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://cpass-admin.vercel.app,http://localhost:4200}

# ----------------------------------------
# ADMIN AUTH (override via env vars in prod)
# ----------------------------------------
app.admin.email=${ADMIN_EMAIL:admin@jawupay.com}
app.admin.password=${ADMIN_PASSWORD:changeme}
app.admin.name=${ADMIN_NAME:Administrator}

# ----------------------------------------
# EMAIL
# ----------------------------------------
app.email.default-from=${MAIL_USERNAME:noreply@clubchretien.org}

# ----------------------------------------
# SWAGGER / OPENAPI (paths fixes)
# ----------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=false
