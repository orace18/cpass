server:
  port: 8080

spring:
  application:
    name: internal-cpaas
  datasource:
    url: jdbc:postgresql://localhost:5432/cpass
    username: cpass
    password: cpass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
      repositories:
        enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  admin-token: change-me-admin-token
  messaging:
    exchange: cpass.message.exchange
    queue: cpass.message.dispatch.queue
    routing-key: cpass.message.dispatch
  security:
    master-key: 0123456789abcdef0123456789abcdef
    hmac:
      allowed-skew-seconds: 300
      nonce-ttl-seconds: 300
      signing-version: v1
  otp:
    length: 6
    ttl-seconds: 300
    max-send-retries: 3
    max-verify-attempts: 5
    cooldown-seconds: 60
    message-template: "Your verification code is {otp}"
    hash-pepper: replace-with-long-random-pepper
  kyc:
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: cpass-kyc
      access-key: minioadmin
      secret-key: minioadmin

logging:
  level:
    root: INFO
    com.cpass.platform: INFO
