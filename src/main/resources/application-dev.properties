# ----------------------------------------
# SERVER
# ----------------------------------------
server.port=8080
server.servlet.context-path=/internal-cpaas

# ----------------------------------------
# DATABASE
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cpass}
spring.datasource.username=${DB_USER:cpass}
spring.datasource.password=${DB_PASSWORD:cpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ----------------------------------------
# HIKARI
# ----------------------------------------
spring.datasource.hikari.pool-name=HikariCpassDevPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true

# ----------------------------------------
# REDIS
# ----------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3s
spring.data.redis.repositories.enabled=false

# ----------------------------------------
# RABBITMQ
# ----------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ----------------------------------------
# APP SECURITY
# ----------------------------------------
app.admin-token=${ADMIN_TOKEN:change-me-admin-token}
app.security.master-key=${SECURITY_MASTER_KEY:0123456789abcdef0123456789abcdef}

# ----------------------------------------
# OTP
# ----------------------------------------
app.otp.hash-pepper=${OTP_HASH_PEPPER:replace-with-long-random-pepper-dev}

# ----------------------------------------
# KYC / S3 (MinIO)
# ----------------------------------------
app.kyc.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.kyc.s3.access-key=${S3_ACCESS_KEY:minioadmin}
app.kyc.s3.secret-key=${S3_SECRET_KEY:minioadmin}

# ----------------------------------------
# EMAIL (SMTP Bootstrap)
# ----------------------------------------
app.email.bootstrap.enabled=true
app.email.bootstrap.host=${SMTP_HOST:mail.clubchretien.org}
app.email.bootstrap.port=${SMTP_PORT:465}
app.email.bootstrap.username=${SMTP_USER:noreply@clubchretien.org}
app.email.bootstrap.password=${SMTP_PASSWORD:}
app.email.bootstrap.from-email=${SMTP_FROM:noreply@clubchretien.org}
app.email.bootstrap.from-name=${SMTP_FROM_NAME:CPaaS}

# ----------------------------------------
# ACTUATOR
# ----------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=false

# ----------------------------------------
# SWAGGER / OPENAPI
# ----------------------------------------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ----------------------------------------
# LOGGING
# ----------------------------------------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.cpass.platform=${LOG_LEVEL_CPASS:DEBUG}
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
