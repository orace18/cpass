spring:
  datasource:
    url: jdbc:h2:mem:cpass;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  admin-token: test-admin-token
  messaging:
    exchange: test.exchange
    queue: test.queue
    routing-key: test.routing
  security:
    master-key: 0123456789abcdef0123456789abcdef
    jwt:
      secret: test-jwt-secret-value-which-is-long-enough
      issuer: cpass-test
      ttl-seconds: 1800
    hmac:
      allowed-skew-seconds: 300
      nonce-ttl-seconds: 300
      signing-version: v1
  otp:
    length: 6
    ttl-seconds: 120
    max-send-retries: 3
    max-verify-attempts: 3
    cooldown-seconds: 60
    message-template: "Your verification code is {otp}"
    hash-pepper: test-pepper
  kyc:
    validity-days: 365
    auto-approve-score-threshold: 75
    external-fallback-score-threshold: 70
    async-enabled: false
    messaging:
      exchange: test.kyc.exchange
      queue: test.kyc.queue
      routing-key: test.kyc.routing
    flow:
      level-0: OTP
      level-1: OTP,ID_UPLOAD,OCR_EXTRACTION,DOCUMENT_EXPIRY_CHECK,FACE_MATCH
      level-2: OTP,ID_UPLOAD,OCR_EXTRACTION,DOCUMENT_EXPIRY_CHECK,FACE_MATCH,FIELD_VERIFICATION
      level-3: OTP,ID_UPLOAD,OCR_EXTRACTION,DOCUMENT_EXPIRY_CHECK,FACE_MATCH,FIELD_VERIFICATION,SOCIAL_GUARANTEE,EXTERNAL_PROVIDER_FALLBACK
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: cpass-kyc
      access-key: minioadmin
      secret-key: minioadmin
