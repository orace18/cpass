services:
  cpass-db:
    image: postgres:16-alpine
    container_name: ${CI_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-cpass}
      - POSTGRES_USER=${DB_USER:-cpass}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-cpass}
    volumes:
      - cpass-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cpass} -d ${DB_NAME:-cpass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cpass_net

  cpass-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ${CI_PROJECT_NAME}-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cpass_net

  cpass-redis:
    image: redis:7-alpine
    container_name: ${CI_PROJECT_NAME}-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cpass_net

  spring-app:
    image: ${IMAGE_FULL}
    container_name: ${CI_PROJECT_NAME}
    restart: unless-stopped
    depends_on:
      cpass-db:
        condition: service_healthy
      cpass-rabbitmq:
        condition: service_healthy
      cpass-redis:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:-cpass-db}:${DB_PORT:-5432}/${DB_NAME:-cpass}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-cpass}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-cpass}

      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-cpass-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}

      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST:-cpass-rabbitmq}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-guest}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}

      - APP_ADMIN_TOKEN=${ADMIN_TOKEN:-change-me-admin-token}
      - APP_SECURITY_MASTER_KEY=${SECURITY_MASTER_KEY:-0123456789abcdef0123456789abcdef}
      - APP_OTP_HASH_PEPPER=${OTP_HASH_PEPPER:-replace-with-long-random-pepper}

      - APP_KYC_S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - APP_KYC_S3_BUCKET=${S3_BUCKET:-cpass-kyc}
      - APP_KYC_S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - APP_KYC_S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}

      - LOGGING_LEVEL_ROOT=${LOG_LEVEL_ROOT:-INFO}
      - LOGGING_LEVEL_COM_CPASS_PLATFORM=${LOG_LEVEL_CPASS:-DEBUG}

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.cpass-dev.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/${CI_PROJECT_NAME}`)"
      - "traefik.http.routers.cpass-dev.entrypoints=websecure"
      - "traefik.http.routers.cpass-dev.tls.certresolver=myresolver"
      - "traefik.http.services.cpass-dev.loadbalancer.server.port=8080"
      - "traefik.http.routers.cpass-dev.middlewares=cpass-dev-strip,cpass-dev-addctx"
      - "traefik.http.middlewares.cpass-dev-strip.stripprefix.prefixes=/${CI_PROJECT_NAME}"
      - "traefik.http.middlewares.cpass-dev-addctx.addprefix.prefix=/internal-cpaas"
      - "traefik.http.routers.cpass-dev-direct.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/internal-cpaas`)"
      - "traefik.http.routers.cpass-dev-direct.entrypoints=websecure"
      - "traefik.http.routers.cpass-dev-direct.tls.certresolver=myresolver"
      - "traefik.http.routers.cpass-dev-direct.service=cpass-dev"
      - "traefik.http.routers.cpass-dev-docs.rule=Host(`${API_DOMAIN}`) && (PathPrefix(`/internal-cpaas/v3/api-docs`) || PathPrefix(`/internal-cpaas/swagger-ui`) || Path(`/internal-cpaas/swagger-ui.html`))"
      - "traefik.http.routers.cpass-dev-docs.entrypoints=websecure"
      - "traefik.http.routers.cpass-dev-docs.tls.certresolver=myresolver"
      - "traefik.http.routers.cpass-dev-docs.service=cpass-dev"

    networks:
      - traefik_net
      - cpass_net

volumes:
  cpass-db-data:

networks:
  traefik_net:
    external: true
  cpass_net:
    external: true
