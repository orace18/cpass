services:
  cpass-db:
    image: postgres:16-alpine
    container_name: ${CI_PROJECT_NAME}-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - cpass-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cpass_net

  cpass-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ${CI_PROJECT_NAME}-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cpass_net

  spring-app:
    image: ${IMAGE_FULL}
    container_name: ${CI_PROJECT_NAME}
    restart: unless-stopped
    depends_on:
      cpass-db:
        condition: service_healthy
      cpass-rabbitmq:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:-cpass-db}:${DB_PORT:-5432}/${DB_NAME:-cpass}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USER}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}

      - APP_ADMIN_TOKEN=${ADMIN_TOKEN}
      - APP_SECURITY_MASTER_KEY=${SECURITY_MASTER_KEY}
      - APP_OTP_HASH_PEPPER=${OTP_HASH_PEPPER}

      # MinIO S3 API port, not the web console port
      - APP_KYC_S3_ENDPOINT=${S3_ENDPOINT}
      - APP_KYC_S3_BUCKET=${S3_BUCKET}
      - APP_KYC_S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - APP_KYC_S3_SECRET_KEY=${S3_SECRET_KEY}

      - APP_EMAIL_BOOTSTRAP_ENABLED=true
      - APP_EMAIL_BOOTSTRAP_HOST=${SMTP_HOST}
      - APP_EMAIL_BOOTSTRAP_PORT=${SMTP_PORT}
      - APP_EMAIL_BOOTSTRAP_USERNAME=${SMTP_USER}
      - APP_EMAIL_BOOTSTRAP_PASSWORD=${SMTP_PASSWORD}
      - APP_EMAIL_BOOTSTRAP_FROM_EMAIL=${SMTP_FROM}
      - APP_EMAIL_BOOTSTRAP_FROM_NAME=${SMTP_FROM_NAME}

      - LOGGING_LEVEL_ROOT=${LOG_LEVEL_ROOT}
      - LOGGING_LEVEL_COM_CPASS_PLATFORM=${LOG_LEVEL_CPASS}

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.cpass-dev.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/${CI_PROJECT_NAME}`)"
      - "traefik.http.routers.cpass-dev.entrypoints=websecure"
      - "traefik.http.routers.cpass-dev.tls.certresolver=myresolver"
      - "traefik.http.services.cpass-dev.loadbalancer.server.port=8080"
      - "traefik.http.routers.cpass-dev.middlewares=cpass-dev-strip,cpass-dev-addctx"
      - "traefik.http.middlewares.cpass-dev-strip.stripprefix.prefixes=/${CI_PROJECT_NAME}"
      - "traefik.http.middlewares.cpass-dev-addctx.addprefix.prefix=/internal-cpaas"
      - "traefik.http.routers.cpass-dev-direct.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/internal-cpaas`)"
      - "traefik.http.routers.cpass-dev-direct.entrypoints=websecure"
      - "traefik.http.routers.cpass-dev-direct.tls.certresolver=myresolver"
      - "traefik.http.routers.cpass-dev-direct.service=cpass-dev"
      - "traefik.http.routers.cpass-dev-docs.rule=Host(`${API_DOMAIN}`) && (PathPrefix(`/internal-cpaas/v3/api-docs`) || PathPrefix(`/internal-cpaas/swagger-ui`) || Path(`/internal-cpaas/swagger-ui.html`))"
      - "traefik.http.routers.cpass-dev-docs.entrypoints=websecure"
      - "traefik.http.routers.cpass-dev-docs.tls.certresolver=myresolver"
      - "traefik.http.routers.cpass-dev-docs.service=cpass-dev"

    networks:
      - traefik_net
      - cpass_net
      - club_chretien_net

volumes:
  cpass-db-data:

networks:
  traefik_net:
    external: true
  cpass_net:
    external: true
  club_chretien_net:
    external: true